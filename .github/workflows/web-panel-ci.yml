name: Web panel CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  web-panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web-panel
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web-panel
        run: pnpm run build

      - name: Test
        working-directory: web-panel
        run: pnpm test

      - name: Check generated bridge bundles
        run: |
          node --check web-panel/dist/bridge.cjs
          node --check web-panel/dist/renderer-scripts/remote-popup-cleanup.js

      - name: Reject debug artifacts in production dist
        run: |
          if grep -R -n -E 'mock-instance|Mock Adventure|Simulation|Debug session|mock=1|demo-session|vite\.svg|tailwind-merge|class-variance-authority|clsx' web-panel/dist; then
            echo "Production dist contains forbidden debug or helper content"
            exit 1
          fi
